services:
  - type: web
    name: setbacks-study
    runtime: docker
    plan: starter            # persistent disks need a paid plan
    healthCheckPath: /api/health
    disk:
      name: study-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/study.db
      - key: LLM_PROVIDER
        value: anthropic
      - key: COACH_MODEL
        value: claude-opus-5-5
      - key: PERSONA_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
